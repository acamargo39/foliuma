function collectReminders(){
  const out=[];
  allPages().forEach(({nb,sec,page})=>{ const h=getPage(page.id).html; if(!h||h.indexOf('data-due=')<0)return;
    const doc=new DOMParser().parseFromString(h,'text/html');
    doc.querySelectorAll('[data-due]').forEach((el,i)=>{ const c=el.cloneNode(true); c.querySelectorAll('ul,ol').forEach(x=>x.remove()); out.push({pid:page.id,idx:i,repeat:el.dataset.repeat||'',due:+el.dataset.due,text:c.textContent.trim()||'(linha sem texto)',done:el.dataset.checked==='true',isTask:el.tagName==='LI'&&el.dataset.checked!=null,page,sec,nb}) }); });
  return out.sort((a,b)=>a.due-b.due);
}
function editReminder(pid,idx,fn){ const d=getPage(pid); const doc=new DOMParser().parseFromString(d.html,'text/html'); const el=doc.querySelectorAll('[data-due]')[idx]; if(!el)return; fn(el); d.html=doc.body.innerHTML; savePage(pid); if(editor&&curPage()?.id===pid){editor.innerHTML=d.html;prepareEditor()} }
let notifyAsked=false;
function askNotifyOnce(){ if(notifyAsked||!('Notification' in window))return; notifyAsked=true; if(Notification.permission==='default'){ try{Notification.requestPermission().catch(()=>{})}catch(_){} } }
function checkDue(){
  const now=Date.now(); const notified=new Set(tree.settings.notified); let changed=false;
  collectReminders().forEach(r=>{ if(r.done||r.due>now||now-r.due>86400000*2)return; const key=r.pid+':'+r.due+':'+r.text.slice(0,24); if(notified.has(key))return;
    notified.add(key); changed=true;
    toast('⏰ '+r.text.slice(0,90),{label:'Abrir',fn:()=>openPage(r.pid)});
    if(r.repeat) setTimeout(()=>editReminder(r.pid,r.idx,el=>{ if(!el.dataset.repeat)return; const nx=nextDueMs(+el.dataset.due,el.dataset.repeat); el.dataset.due=String(nx); el.dataset.dueLabel=dueLabel(nx)+' ↻'; }),0);
    try{ if('Notification' in window&&Notification.permission==='granted') new Notification('Lembrete · Foliuma',{body:r.text.slice(0,140)}); }catch(_){}
  });
  const today=dayKey(new Date());
  allPages().forEach(({page})=>{ if(!page.end||page.end>today||page.status==='done')return; const key='page:'+page.id+':'+page.end; if(notified.has(key))return; notified.add(key); changed=true;
    const msg=(page.end===today?'📄 Prazo hoje: ':'📄 Prazo vencido: ')+(page.title||'Sem título'); toast(msg.slice(0,100),{label:'Abrir',fn:()=>openPage(page.id)});
    try{ if('Notification' in window&&Notification.permission==='granted') new Notification('Foliuma',{body:msg.slice(0,140)}); }catch(_){} });
  allPages().forEach(({page})=>{ const d=getPage(page.id); if(d.kind!=='board'||!d.board)return; d.board.cards.forEach(c=>{ if(!c.end||c.end>today||cardState(c,d.board).done)return;
    const key='card:'+c.id+':'+c.end; if(notified.has(key))return; notified.add(key); changed=true; const msg=(c.end===today?'📋 Prazo hoje: ':'📋 Prazo vencido: ')+c.title;
    toast(msg.slice(0,100),{label:'Abrir',fn:()=>{openPage(page.id);setTimeout(()=>cardModal(c.id),60)}});
    try{ if('Notification' in window&&Notification.permission==='granted') new Notification('Foliuma',{body:msg.slice(0,140)}); }catch(_){} }); });
  if(changed){ tree.settings.notified=[...notified].slice(-300); saveTree(); }
  markOverdue(); renderRail();
  if(tree.cur.view==='reminders'||tree.cur.view==='home') renderEditorLight();
}

/* ----- audio ----- */
const audioUrls={}, audioEls=new WeakMap();
let rec=null;
function blobToB64(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(b)})}
function b64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime||'audio/webm'})}
const audioPath=(id,n,shared)=>shared?`sharedau/${id}_${n}`:`data/users/${viewerId}/audio/chunks/${id}_${n}`;
async function uploadAudio(id,blob,mime,dur,shared){
  if(!remoteOk)return; try{ const b64=await blobToB64(blob); const size=180000; const total=Math.max(1,Math.ceil(b64.length/size));
    for(let n=0;n<total;n++) await db.doc(audioPath(id,n,shared)).set({kind:'audio',mime,dur,n,total,data:b64.slice(n*size,(n+1)*size)});
  }catch(e){ toast(e&&e.code==='quota_exceeded'?'Sem espaço para salvar o áudio na conta. Ele ficou salvo neste navegador.':'O áudio ficou salvo neste navegador, mas não foi enviado para a conta.'); }
}
async function loadAudio(id,preferShared){
  const loc=await idb.get('audio:'+id); if(loc&&loc.blob) return loc;
  if(!remoteOk)return null;
  for(const shared of preferShared?[true,false]:[false,true]){
    try{ const first=await db.doc(audioPath(id,0,shared)).get(); if(!first.exists)continue; const f=first.data(); const parts=[f.data];
      for(let n=1;n<(f.total||1);n++){ const d=await db.doc(audioPath(id,n,shared)).get(); if(!d.exists)throw new Error('missing'); parts.push(d.data().data) }
      const out={blob:b64ToBlob(parts.join(''),f.mime),mime:f.mime,dur:f.dur}; idb.put('audio:'+id,out); return out;
    }catch(_){}
  }
  return null;
}
async function audioUrl(id){ if(audioUrls[id])return audioUrls[id]; const f=findPage(curPage()?.id||''); const a=await loadAudio(id,!!(f&&f.nb.shared)); if(!a)return null; audioUrls[id]=URL.createObjectURL(a.blob); return audioUrls[id]; }
function hydrateAudio(el){
  el.setAttribute('contenteditable','false');
  const dur=+el.dataset.dur||0, at=+el.dataset.at||0;
  const bars=Array.from({length:42},(_,i)=>{const h=6+Math.abs(Math.sin((i+1)*(el.dataset.audio.charCodeAt(i%el.dataset.audio.length)||7)*.37))*18;return `<i style="height:${h.toFixed(0)}px"></i>`}).join('');
  el.innerHTML=`<button class="aplay" data-a="play" title="Reproduzir">${icon('play')}</button><div class="ainfo"><div class="atitle">Gravação de áudio<small>${at?new Date(at).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''}</small></div><div class="abar" data-a="seek">${bars}</div></div><span class="atime">0:00 / ${fmtDur(dur)}</span><button class="aspeed" data-a="speed" title="Velocidade">1×</button><button class="iconbtn" data-a="more" title="Opções" style="width:28px;height:28px">${icon('dots')}</button>`+
    (el.dataset.transcript?`<details class="atrans"><summary>Transcrição</summary><div class="ttext">${esc(el.dataset.transcript)}</div><div class="tacts"><button data-a="tins">Inserir como texto</button><button data-a="tcopy">Copiar</button><button data-a="tsum">${icon('spark')} Resumir com IA</button></div></details>`:'');
}
function audioProgress(el,a){ const d=a.duration&&isFinite(a.duration)?a.duration:(+el.dataset.dur||0); const pct=d?a.currentTime/d:0; const bars=el.querySelectorAll('.abar i'); const k=Math.round(pct*bars.length); bars.forEach((b,i)=>b.classList.toggle('on',i<k)); const t=el.querySelector('.atime'); if(t)t.textContent=fmtDur(a.currentTime)+' / '+fmtDur(d); }
async function audioClick(e,el){
  const b=e.target.closest('[data-a]'); if(!b)return; e.preventDefault(); const id=el.dataset.audio;
  let a=audioEls.get(el);
  const ensure=async()=>{ if(a)return a; const url=await audioUrl(id); if(!url){toast('Este áudio não está disponível neste dispositivo.');return null} a=new Audio(url); a.preload='auto'; audioEls.set(el,a);
    a.addEventListener('timeupdate',()=>audioProgress(el,a)); a.addEventListener('ended',()=>{el.querySelector('.aplay').innerHTML=icon('play');}); return a; };
  if(b.dataset.a==='play'){ if(!(await ensure()))return; if(a.paused){ $$('.audio',editor).forEach(o=>{const x=audioEls.get(o);if(x&&x!==a&&!x.paused){x.pause();o.querySelector('.aplay').innerHTML=icon('play')}}); a.play().catch(()=>toast('Não foi possível reproduzir este áudio.')); b.innerHTML=icon('pause'); } else { a.pause(); b.innerHTML=icon('play'); } }
  if(b.dataset.a==='seek'){ if(!(await ensure()))return; const r=b.getBoundingClientRect(); const d=a.duration&&isFinite(a.duration)?a.duration:(+el.dataset.dur||0); a.currentTime=Math.max(0,Math.min(d,(e.clientX-r.left)/r.width*d)); audioProgress(el,a); }
  if(b.dataset.a==='speed'){ const sp=[1,1.25,1.5,2]; const cur_=a?a.playbackRate:1; const nx=sp[(sp.indexOf(cur_)+1)%sp.length]; if(await ensure()){a.playbackRate=nx;b.textContent=nx+'×'} }
  if(b.dataset.a==='tins'){ const p=document.createElement('p'); p.textContent=el.dataset.transcript; el.after(p); caretAt(p,false); onEdit(); toast('Transcrição inserida abaixo do áudio.'); return }
  if(b.dataset.a==='tcopy'){ try{await navigator.clipboard.writeText(el.dataset.transcript);toast('Transcrição copiada.')}catch(_){toast('Não foi possível copiar.')} return }
  if(b.dataset.a==='tsum'){ if(!sampleFn){toast('O assistente de IA não está disponível nesta visualização.');return} openAI(); runAI('tsum',null,el.dataset.transcript); return }
  if(b.dataset.a==='more') showMenu(b,[{label:'Baixar áudio',disabled:!downloads,action:async()=>{const x=await loadAudio(id,!!findPage(curPage().id)?.nb.shared);if(!x){toast('Áudio indisponível.');return}const ext=(x.mime||'').includes('mp4')?'m4a':(x.mime||'').includes('ogg')?'ogg':'webm';saveFile('gravacao-'+new Date(+el.dataset.at||Date.now()).toISOString().slice(0,16).replace(/[:T]/g,'-')+'.'+ext,x.blob)}},{label:'Remover gravação',danger:true,action:()=>{ if(a)a.pause(); el.remove(); onEdit(); }}]);
}
let srWarned=false;
function startTranscription(r){
  if(tree.settings.transcribe===false)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ r.srFailed=true; if(!srWarned){srWarned=true;toast('Gravando. A transcrição automática não funciona neste navegador (use Chrome, Edge ou Safari).')} return }
  let sr; try{ sr=new SR(); }catch(_){ r.srFailed=true; return }
  const lang=(navigator.language||'pt-BR'); sr.lang=/^pt/i.test(lang)?'pt-BR':lang; sr.continuous=true; sr.interimResults=true;
  sr.onresult=ev=>{ let interim=''; for(let i=ev.resultIndex;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) r.final+=(r.final?' ':'')+t.trim(); else interim+=t; } r.interim=interim.trim();
    const all=(r.final+' '+r.interim).trim(); $('#recText').textContent=all.length>60?'…'+all.slice(-58):all; };
  sr.onerror=ev=>{ if(ev.error!=='no-speech'&&ev.error!=='aborted'){ r.srFailed=true; r.sr=null; } };
  sr.onend=()=>{ if(r.final&&r.interim){ r.final+=' '+r.interim; r.interim=''; } if(rec===r&&!r.stopping&&r.sr===sr){ try{sr.start()}catch(_){} } };
  r.sr=sr; try{ sr.start(); }catch(_){ r.srFailed=true; r.sr=null; }
}
async function startRecording(){
  if(rec)return; const p=curPage(); if(!p||!editor){toast('Abra uma página para gravar.');return}
  if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){toast('Gravação de áudio não é suportada neste navegador.');return}
  const range=lastRange?lastRange.cloneRange():null;
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}) }
  catch(e){ toast(e&&e.name==='NotAllowedError'?'O microfone foi bloqueado. Libere o acesso nas configurações do navegador e tente de novo.':'Não foi possível acessar o microfone nesta visualização. Abra o app em tela cheia e tente de novo.'); return }
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  let mr; try{ mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:undefined) }catch(_){ mr=new MediaRecorder(stream) }
  rec={mr,stream,chunks:[],start:Date.now(),pid:p.id,range,cancel:false,timer:null,raf:0,ctx:null,final:'',interim:'',sr:null,stopping:false};
  $('#recText').textContent='';
  startTranscription(rec);
  mr.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data)};
  mr.onstop=finishRecording; mr.start(1000);
  const lv=$('#recLevel'); lv.innerHTML='<i></i>'.repeat(14);
  try{ const AC=window.AudioContext||window.webkitAudioContext; rec.ctx=new AC(); const src=rec.ctx.createMediaStreamSource(stream); const an=rec.ctx.createAnalyser(); an.fftSize=64; src.connect(an); const arr=new Uint8Array(an.frequencyBinCount); const bars=[...lv.children];
    const loop=()=>{ if(!rec)return; an.getByteFrequencyData(arr); bars.forEach((b,i)=>{b.style.height=(4+(arr[i+1]||0)/255*18).toFixed(0)+'px'}); rec.raf=requestAnimationFrame(loop) }; loop(); }catch(_){}
  $('#recorder').classList.add('show'); $('#toolbar [data-act="record"]')?.classList.add('rec','on');
  rec.timer=setInterval(()=>{ const s=(Date.now()-rec.start)/1000; $('#recTime').textContent=fmtDur(s); if(s>=900){toast('Limite de 15 minutos atingido. Gravação salva.');stopRecording(false)} },250);
}
function stopRecording(cancel){ if(!rec)return; rec.cancel=cancel; rec.stopping=true; try{rec.sr&&rec.sr.stop()}catch(_){} clearInterval(rec.timer); cancelAnimationFrame(rec.raf); try{rec.mr.state!=='inactive'&&rec.mr.stop()}catch(_){finishRecording()} }
async function finishRecording(){
  const r=rec; if(!r)return; rec=null;
  r.stream.getTracks().forEach(t=>t.stop()); try{r.ctx&&r.ctx.close()}catch(_){}
  $('#recorder').classList.remove('show'); $('#recTime').textContent='0:00'; $('#toolbar [data-act="record"]')?.classList.remove('rec','on');
  if(r.cancel||!r.chunks.length)return;
  const mime=r.mr.mimeType||'audio/webm'; const blob=new Blob(r.chunks,{type:mime}); const dur=Math.round((Date.now()-r.start)/1000);
  const id=uid(); await idb.put('audio:'+id,{blob,mime,dur}); audioUrls[id]=URL.createObjectURL(blob);
  await new Promise(res=>setTimeout(res,r.sr?700:0));
  const transcript=(r.final+' '+r.interim).replace(/\s+/g,' ').trim(); $('#recText').textContent='';
  const html=`<div class="audio" contenteditable="false" data-audio="${id}" data-dur="${dur}" data-at="${Date.now()}"${transcript?` data-transcript="${esc(transcript)}"`:''}></div><p><br></p>`;
  if(editor&&curPage()?.id===r.pid){ editor.focus(); if(r.range&&editor.contains(r.range.startContainer)){const s=getSelection();s.removeAllRanges();s.addRange(r.range)} else caretAt(editor,false);
    let blk=curBlock(); while(blk&&blk.parentNode!==editor)blk=blk.parentNode;
    const t=document.createElement('div'); t.innerHTML=html; const nodes=[...t.childNodes];
    if(blk&&blk.tagName==='P'&&!blk.textContent.trim()&&!blk.querySelector('img')) blk.replaceWith(...nodes); else if(blk) blk.after(...nodes); else editor.append(...nodes);
    caretAt(nodes[nodes.length-1],true);
    editor.querySelectorAll(`.audio[data-audio="${id}"]`).forEach(hydrateAudio); onEdit(); }
  else { const d=getPage(r.pid); d.html=(d.html||'')+html; savePage(r.pid); }
  toast('Gravação salva ('+fmtDur(dur)+')'+(transcript?' com transcrição.':r.srFailed?'. Transcrição indisponível neste navegador.':'.'));
  const f=findPage(r.pid); uploadAudio(id,blob,mime,dur,!!(f&&f.nb.shared));
}
$('#recStop').addEventListener('click',()=>stopRecording(false));
$('#recCancel').addEventListener('click',()=>stopRecording(true));
async function migrateAudio(pids,toShared){
  if(!remoteOk)return; for(const pid of pids){ const ids=[...(getPage(pid).html||'').matchAll(/data-audio="([^"]+)"/g)].map(m=>m[1]);
    for(const id of ids){ const a=await loadAudio(id,!toShared); if(a) await uploadAudio(id,a.blob,a.mime,a.dur,toShared); } }

const ALLOWED=new Set(['P','BR','B','STRONG','I','EM','U','S','STRIKE','A','UL','OL','LI','H1','H2','H3','H4','BLOCKQUOTE','PRE','CODE','TABLE','THEAD','TBODY','TR','TD','TH','IMG','HR','SPAN','DIV','SUB','SUP']);
function sanitize(html,opts){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const walk=el=>{[...el.children].forEach(c=>{
    if(!ALLOWED.has(c.tagName)){ if(/^(SCRIPT|STYLE|META|LINK|IFRAME|OBJECT|NOSCRIPT|TITLE)$/.test(c.tagName)){c.remove();return} walk(c); c.replaceWith(...c.childNodes); return }
    const keep={}; if(c.tagName==='A'&&/^https?:|^mailto:/.test(c.getAttribute('href')||''))keep.href=c.getAttribute('href');
    if(c.tagName==='IMG'){const src=c.getAttribute('src')||''; if(!src.startsWith('data:image/')){c.remove();return} keep.src=src}
    if(c.tagName==='H4'){const h=document.createElement('h3');h.append(...c.childNodes);c.replaceWith(h);walk(h);return}
    if(opts&&opts.tags&&(c.getAttribute('data-tag')||c.getAttribute('data-onetag'))) keep['data-onetag']=c.getAttribute('data-tag')||c.getAttribute('data-onetag');
    [...c.attributes].forEach(a=>c.removeAttribute(a.name)); Object.entries(keep).forEach(([k,v])=>c.setAttribute(k,v));
    walk(c);
  })};
  walk(doc.body); return doc.body.innerHTML;
}
function onPaste(e){
  const cd=e.clipboardData; if(!cd)return;
  const files=[...cd.files||[]].filter(f=>f.type.startsWith('image/'));
  if(files.length){ e.preventDefault(); files.forEach(insertImageFile); return }
  const b=curBlock(); if(b&&b.tagName==='PRE'){ e.preventDefault(); document.execCommand('insertText',false,cd.getData('text/plain')); return }
  const html=cd.getData('text/html');
  if(html){ e.preventDefault(); document.execCommand('insertHTML',false,sanitize(html)); onEdit(); }
}
function onDrop(e){ const files=[...e.dataTransfer.files||[]].filter(f=>f.type.startsWith('image/')); if(!files.length)return; e.preventDefault();
  if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(e.clientX,e.clientY);if(r){const s=getSelection();s.removeAllRanges();s.addRange(r);lastRange=r.cloneRange()}}
  files.forEach(insertImageFile); }
$('#imgInput').addEventListener('change',e=>{[...e.target.files].forEach(insertImageFile);e.target.value=''});
function compressImage(file){
  return new Promise((res,rej)=>{
    if(file.size<120000&&/image\/(gif|svg\+xml|png)/.test(file.type)){const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file);return}
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const max=1400; let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      let q=.82, d=c.toDataURL('image/jpeg',q); while(d.length>170000&&q>.45){q-=.1;d=c.toDataURL('image/jpeg',q)} res(d) };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))}; img.src=url;
  });
}

}

function tableOp(op,cell){

function toggleDraw(){ drawMode=!drawMode; edwrap.classList.toggle('drawing-on',drawMode); sheet.classList.toggle('drawing',drawMode); editor.contentEditable=drawMode?'false':'true'; hideImgBar(); hideBubble(); syncDrawBar(); if(drawMode)toast('Modo desenho: use mouse, caneta ou dedo. Clique em Concluir para voltar ao texto.'); }
function syncDrawBar(){ $$('[data-tool]',edwrap).forEach(b=>b.classList.toggle('on',b.dataset.tool===ink.tool)); $$('[data-ink]',edwrap).forEach(b=>b.classList.toggle('on',b.dataset.ink===ink.color&&ink.tool!=='eraser')); }
function pathD(pts){ if(!pts.length)return''; if(pts.length<3){const [x,y]=pts[0];const l=pts[pts.length-1];return `M${x} ${y}L${l[0]+.1} ${l[1]+.1}`} let d=`M${pts[0][0]} ${pts[0][1]}`; for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=`Q${pts[i][0]} ${pts[i][1]} ${mx.toFixed(1)} ${my.toFixed(1)}`} const l=pts[pts.length-1]; return d+`L${l[0]} ${l[1]}`; }
function strokeEl(s){ const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',pathD(s.pts)); p.setAttribute('fill','none'); p.setAttribute('stroke',s.c); p.setAttribute('stroke-width',s.w); p.setAttribute('stroke-linecap',s.hl?'butt':'round'); p.setAttribute('stroke-linejoin','round'); if(s.hl)p.setAttribute('stroke-opacity','.38'); return p; }
function renderInk(){ const svg=$('#ink'); if(!svg||!curPage())return; svg.innerHTML=''; getPage(curPage().id).strokes.forEach(s=>svg.appendChild(strokeEl(s))); }
let stroke=null;
function ptOf(e){ const r=sheet.getBoundingClientRect(); return [Math.round((e.clientX-r.left)*10)/10,Math.round((e.clientY-r.top)*10)/10]; }
function inkDown(e){ if(!drawMode)return; e.preventDefault(); try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
  const pt=ptOf(e); if(ink.tool==='eraser'){stroke={erase:true};eraseAt(pt);return}
  const hl=ink.tool==='hl'; stroke={s:{pts:[pt],c:ink.color,w:hl?Math.max(12,ink.w*4):ink.w,hl}}; stroke.el=strokeEl(stroke.s); $('#ink').appendChild(stroke.el); }
function inkMove(e){ if(!stroke)return; const pt=ptOf(e); if(stroke.erase){eraseAt(pt);return} const l=stroke.s.pts[stroke.s.pts.length-1]; if(Math.hypot(pt[0]-l[0],pt[1]-l[1])<1.5)return; stroke.s.pts.push(pt); stroke.el.setAttribute('d',pathD(stroke.s.pts)); }
function inkUp(){ if(!stroke)return; const id=curPage().id; if(!stroke.erase) getPage(id).strokes.push(stroke.s); savePage(id); stroke=null; }
function eraseAt([x,y]){ const d=getPage(curPage().id); const n=d.strokes.length; d.strokes=d.strokes.filter(s=>!s.pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<s.w/2+10)); if(d.strokes.length!==n)renderInk(); }

function cardHTML(c,b,ro){

function moveCard(cid,colId,beforeId){

function timelineHTML(b,vis){
  const cards=b.cards.filter(c=>vis(c)&&(c.start||c.end)).sort((x,y)=>(x.start||x.end).localeCompare(y.start||y.end));
  const nodate=b.cards.filter(c=>vis(c)&&!c.start&&!c.end);
  const noDateHTML=nodate.length?`<div class="group" style="margin-top:18px"><h3>Sem datas <span class="mini">${nodate.length}</span></h3>${nodate.map(c=>`<div class="trow" data-card="${c.id}" style="cursor:pointer"><div class="grow"><b style="font-weight:500">${esc(c.title)}</b><small>Clique para definir início e fim</small></div></div>`).join('')}</div>`:'';
  if(!cards.length) return `<div class="empty"><div class="big">📅</div><h2>Nada com datas ainda</h2><p>Defina Início e Fim para ver o item no cronograma.</p></div>`+noDateHTML;
  const today=dayKey(new Date()); const keys=[today];
  cards.forEach(c=>{keys.push(c.start||c.end,c.end||c.start); if(c.startedAt)keys.push(dayKey(c.startedAt)); if(c.doneAt)keys.push(dayKey(c.doneAt))}); keys.sort();

  const idx=k=>Math.round((parseDay(k)-from)/86400000);
  let head='', we='';
  for(let i=0;i<n;i++){ const d=new Date(from); d.setDate(from.getDate()+i); const k=dayKey(d);
    if(i===0||d.getDate()===1) head+=`<span class="tlm" style="left:${i*W+6}px">${cap(d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}</span>`;
    head+=`<span class="tld ${k===today?'today':''}" style="left:${i*W}px">${'DSTQQSS'[d.getDay()]}<br>${d.getDate()}</span>`;
    if(d.getDay()===0||d.getDay()===6) we+=`<span class="tlwe" style="left:${i*W}px;width:${W}px"></span>`; }
  const pos={};
  const rows=cards.map((c,ri)=>{ const st=cardState(c,b); const s=c.start||c.end, e=c.end||c.start; const col=st.col; const color=esc(col?col.color:'#868E96'); const L=idx(s)*W, Wd=(idx(e)-idx(s)+1)*W;
    const blocked=(c.deps||[]).some(id=>{ const d=b.cards.find(x=>x.id===id); return d&&!cardState(d,b).done; });
    pos[c.id]={ri,x1:c.milestone?idx(e)*W+W/2-8:L+2,x2:c.milestone?idx(e)*W+W/2+8:L+Wd-2,s,e};
    let act=''; if(c.startedAt){ const a=idx(dayKey(c.startedAt)), z=idx(c.doneAt?dayKey(c.doneAt):today); act=`<span class="tlact" style="left:${a*W+4}px;width:${Math.max(1,z-a+1)*W-8}px" title="Execução real"></span>`; }
    const bar=c.milestone?`<span class="tlms ${st.late?'late':''} ${st.done?'done':''}" data-card="${c.id}" style="--c:${color};left:${idx(e)*W+W/2-7}px" title="◆ ${esc(c.title)} · ${fmtDay(e)}"></span><span class="tlmsl" style="left:${idx(e)*W+W/2+14}px">${esc(c.title)}</span>`
      :`<span class="tlbar ${st.late?'late':''} ${st.done?'done':''}" data-card="${c.id}" style="--c:${color};left:${L+2}px;width:${Wd-4}px" title="${esc(c.title)} · ${fmtDay(s)} → ${fmtDay(e)}${blocked?' · bloqueado por dependência':''}">${blocked?'🔒 ':''}${esc(c.title)}</span>`;
    return `<div class="tlrow">${we}${bar}${act}</div>`; }).join('');
  const segs=[]; cards.forEach(c=>(c.deps||[]).forEach(id=>{ const a=pos[id], z=pos[c.id]; if(!a||!z)return; const y1=52+a.ri*40+16, y2=52+z.ri*40+16; const bad=z.s<=a.e&&!(a.e===z.s&&false); const conflict=z.s<a.e;
    segs.push(`<path class="${conflict?'bad':''}" d="M${a.x2} ${y1} H${a.x2+8} V${y2} H${Math.max(z.x1-2,a.x2+10)}" marker-end="url(#tla${conflict?'b':''})"/>`); }));
  const arrows=segs.length?`<svg class="tlarrows" width="${n*W}" height="${52+cards.length*40}"><defs><marker id="tla" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor" stroke="none"/></marker><marker id="tlab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#E03131" stroke="none"/></marker></defs>${segs.join('')}</svg>`:'';
  return `<div class="tl"><div class="tlnames"><div class="tlh"></div>${cards.map(c=>{const col=cardState(c,b).col;return `<button class="tln" data-card="${c.id}"><i style="background:${esc(col?col.color:'#868E96')}"></i><span>${esc(c.title)}</span></button>`}).join('')}</div>
    <div class="tlgrid"><div style="width:${n*W}px;position:relative"><div class="tlhead">${head}</div>${rows}${arrows}<span class="tltoday" style="left:${idx(today)*W+W/2}px;top:52px"></span></div></div></div>
    <div class="tllegend"><span><i style="height:10px;background:var(--accent)"></i>Planejado (início → fim)</span><span><i style="height:4px;background:var(--ink);opacity:.5"></i>Execução real registrada</span><span><i style="height:10px;box-shadow:0 0 0 2px var(--danger)"></i>Atrasado</span><span>◆ Marco</span><span>→ Dependência (vermelho: começa antes da anterior terminar)</span></div>`+noDateHTML;
}
function collectDeadlines(){

    d.board.cards.forEach(c=>{ if(!c.end||cardState(c,d.board).done)return; out.push({text:c.title,end:c.end,due:parseDay(c.end).getTime()+86399000,pid:page.id,cid:c.id,page,sec,nb}); }); });
  allPages().forEach(({nb,sec,page})=>{ if(!page.end||page.status==='done')return; out.push({text:page.title||'Sem título',end:page.end,due:parseDay(page.end).getTime()+86399000,pid:page.id,isPage:true,page,sec,nb}); });

/* ================= Cronômetro ================= */
const fmtClock=ms=>{ const t=Math.max(0,Math.floor((ms||0)/1000)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), sc=t%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`:`${m}:${String(sc).padStart(2,'0')}`; };

  if((m=v.match(/^(\d+):(\d{1,2})$/))) return (+m[1]*60+ +m[2])*60000;
  if((m=v.match(/^(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*(?:m|min)?)?$/))&&(m[1]||m[2])){ const h=m[1]?parseFloat(m[1]):0, mi=m[2]?+m[2]:0; if(!m[1]&&m[2]&&!/m/.test(v)) return mi*60000; return Math.round((h*60+mi)*60000); }
  return 0; }
const timerNow=()=>tree.settings.timer||null;

/* ================= Synced blocks ================= */
function syncContent(pid,bid){
  const f=findPage(pid); if(!f)return null; const d=getPage(pid); if(d.kind==='board')return {f,el:null};
  const doc=new DOMParser().parseFromString(d.html||'','text/html'); const el=[...doc.querySelectorAll('[data-bid]')].find(x=>x.dataset.bid===bid); if(!el)return {f,el:null};
  const c=el.cloneNode(true); c.removeAttribute('data-bid'); c.querySelectorAll('[data-bid]').forEach(x=>x.removeAttribute('data-bid'));
  c.querySelectorAll('.sync,.audio').forEach(x=>{const p=doc.createElement('p');p.textContent=x.classList.contains('audio')?'[gravação de áudio]':'[bloco sincronizado]';x.replaceWith(p)});
  c.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  return {f,el:c};
}
function hydrateSync(el){
  el.setAttribute('contenteditable','false');
  const r=syncContent(el.dataset.syncPage,el.dataset.syncBlock);
  const head=(t,btns)=>`<div class="synchead">${icon('link')}<span>${t}</span>${btns}</div>`;
  if(!r){ el.innerHTML=head('A página original foi excluída.','<button data-s="remove">Remover</button>'); return }
  if(!r.el){ el.innerHTML=head(`O bloco original não existe mais em “${esc(r.f.page.title||'Sem título')}”.`,'<button data-s="remove">Remover</button>'); return }
  el.innerHTML=head(`Sincronizado de <b>${esc((r.f.page.icon?r.f.page.icon+' ':'')+(r.f.page.title||'Sem título'))}</b>`,'<button data-s="open">Editar original</button><button data-s="unlink">Desvincular</button>')+'<div class="syncbody"></div>';
  el.querySelector('.syncbody').appendChild(document.importNode(r.el,true));
}
function syncClick(e,el){
  const b=e.target.closest('[data-s]'); if(!b){ return } e.preventDefault(); const a=b.dataset.s;
  if(a==='remove'){ el.remove(); onEdit(); return }
  if(a==='unlink'){ const body=el.querySelector('.syncbody'); const nodes=body?[...body.childNodes]:[]; if(nodes.length)el.replaceWith(...nodes); else el.remove(); onEdit(); toast('Desvinculado. Agora é uma cópia independente.'); return }
  if(a==='open'){ const pid=el.dataset.syncPage, bid=el.dataset.syncBlock; openPage(pid);
    setTimeout(()=>{ const t=editor&&[...editor.querySelectorAll('[data-bid]')].find(x=>x.dataset.bid===bid); if(t){ t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),1900); caretAt(t,false); } },80); }
}
function insertSyncBlock(){
  if(!editor)return; const range=lastRange?lastRange.cloneRange():null; const cur=curPage();

    const d=getPage(pid); const doc=new DOMParser().parseFromString(d.html||'','text/html');

    const kind=el=>/^(UL|OL)$/.test(el.tagName)?'lista':el.tagName==='TABLE'?'tabela':/^H\d$/.test(el.tagName)?'título':el.tagName==='BLOCKQUOTE'?'destaque':el.tagName==='PRE'?'código':'texto';

/* ================= Recorrência ================= */
const REPEAT_OPTS=[['','Não repete'],['daily','Todo dia'],['weekdays','Dias úteis'],['weekly','Toda semana'],['monthly','Todo mês']];
const REPEAT_LABEL={daily:'todo dia',weekdays:'em dias úteis',weekly:'toda semana',monthly:'todo mês'};
function addRule(d,rule){ const x=new Date(d);
  if(rule==='daily') x.setDate(x.getDate()+1);
  else if(rule==='weekly') x.setDate(x.getDate()+7);
  else if(rule==='weekdays'){ do{ x.setDate(x.getDate()+1); }while(x.getDay()===0||x.getDay()===6); }
  else if(rule==='monthly'){ const day=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+1); x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate())); }
  return x; }
function rollKeys(start,end,rule){ const key=end||start; const dur=(start&&end)?daysBetween(start,end):0; let nd=addRule(parseDay(key),rule); const today0=parseDay(dayKey(new Date())); let g=0; while(nd<today0&&g++<500) nd=addRule(nd,rule);
  const nk=dayKey(nd); if(end){ const ns=new Date(nd); ns.setDate(ns.getDate()-dur); return {start:start?dayKey(ns):null,end:nk}; } return {start:nk,end:null}; }
function nextDueMs(ms,rule){ let d=addRule(new Date(ms),rule); let g=0; while(d.getTime()<=Date.now()&&g++<1000) d=addRule(d,rule); return d.getTime(); }
function rollCard(c,b){ if(!c.repeat)return false; if(!c.start&&!c.end) c.end=dayKey(new Date());
  (c.history=c.history||[]).push({doneAt:c.doneAt||Date.now(),startedAt:c.startedAt||null,start:c.start||null,end:c.end||null}); if(c.history.length>200)c.history.shift();
  const r=rollKeys(c.start,c.end,c.repeat); c.start=r.start; c.end=r.end; c.startedAt=null; c.doneAt=null; c.checklist=(c.checklist||[]).map(x=>({...x,done:false}));
  const todo=b.columns.find(x=>x.role==='todo')||b.columns[0]; if(todo)c.col=todo.id;
  setTimeout(()=>toast(`↻ “${c.title}” concluído. Próxima ocorrência: ${fmtDay(c.end||c.start)}.`),40); return true; }
function rollPage(p){ if(!p.start&&!p.end) p.end=dayKey(new Date());
  (p.history=p.history||[]).push({doneAt:p.doneAt||Date.now(),startedAt:p.startedAt||null,start:p.start||null,end:p.end||null}); if(p.history.length>200)p.history.shift();
  const r=rollKeys(p.start,p.end,p.repeat); if(r.start)p.start=r.start; else delete p.start; if(r.end)p.end=r.end; else delete p.end; p.status='todo'; p.startedAt=null; p.doneAt=null;
  setTimeout(()=>toast(`↻ Concluída. Próxima ocorrência de “${p.title||'Sem título'}”: ${fmtDay(p.end||p.start)}.`),40); }

/* ================= Pomodoro ================= */
const pomoCfg=()=>Object.assign({on:false,focus:25,brk:5,long:15,every:4},tree.settings.pomo||{});
let audioCtx=null;
function ensureAudio(){ try{ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC)audioCtx=new AC(); } if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume(); }catch(_){} }
function beep(n=3){ try{ ensureAudio(); if(!audioCtx)return; const t0=audioCtx.currentTime; for(let i=0;i<n;i++){ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=i%2?660:880; const t=t0+i*.3; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.3,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.24); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+.26); } }catch(_){} }
function notifyUser(title,body){ try{ if('Notification' in window&&Notification.permission==='granted') new Notification(title,{body}); }catch(_){} }
function pomoTick(){ const cfg=pomoCfg(); const ps=tree.settings.pomoState; if(!cfg.on||!ps)return; const now=Date.now();
  if(ps.phase==='focus'){ const tm=timerNow(); if(!tm||tm.cid!==ps.cid)return; const left=ps.start+cfg.focus*60000-now; const el=$('#tpPomo'); if(el)el.textContent='🍅 '+fmtClock(Math.max(0,left));
    if(left<=0){ const count=(ps.count||0)+1, long=count%cfg.every===0, mins=long?cfg.long:cfg.brk; stopTimer({ask:false,msg:null,pomo:true});
      tree.settings.pomoState={phase:'break',until:now+mins*60000,count,pid:ps.pid,cid:ps.cid,long}; saveTree(); beep(3);

      zone.addEventListener('paste',async e=>{ const cd=e.clipboardData; if(!cd)return; e.preventDefault(); let h=cd.getData('text/html'), t=cd.getData('text/plain');
        let add=h?sanitize(h,{tags:true}):t?t.split(/\r?\n/).map(l=>l.trim()?`<p>${esc(l)}</p>`:'<p><br></p>').join(''):'';
        for(const f of [...cd.files||[]].filter(x=>x.type.startsWith('image/'))){ try{ add+=`<p><img src="${await compressImage(f)}" alt=""></p>`; }catch(_){} }
        pasted+=add; zone.innerHTML=pasted; if(!$('#impTitle').value){ const tmp=document.createElement('div'); tmp.innerHTML=add; const fe=[...tmp.querySelectorAll('h1,h2,h3,p,li,div')].find(x=>x.textContent.trim()); const first=(fe?fe.textContent:tmp.textContent||'').trim().split('\n')[0].slice(0,80); if(first)$('#impTitle').value=first; } });
      zone.addEventListener('input',()=>{ pasted=zone.innerHTML; });
      zone.addEventListener('keydown',e=>{ if(e.key==='Enter')e.stopPropagation(); });
      zone.addEventListener('drop',e=>{ e.preventDefault(); if(e.dataTransfer.files.length){ $('#impMode [data-m="file"]').click(); addFiles(e.dataTransfer.files); } });
    }});
  if(!r||r.value!=='ok')return;
  const jobs=[];
  if(mode==='paste'){ const html=sanitize(r.data.zone||'',{tags:true}); if(!html.replace(/<[^>]*>|\s|&nbsp;/g,'')&&html.indexOf('<img')<0){ toast('Nada para importar. Cole o conteúdo do OneNote na área indicada.'); return } jobs.push({pasted:true,html,base:r.data.title.trim()||'Página do OneNote',flt:false}); }
  else { if(!files.length){ toast('Escolha ao menos um arquivo exportado do OneNote.'); return } files.forEach(f=>jobs.push({file:f})); }
  let sec, nb;
  if(r.data.dest==='new'){ nb=curNb(); if(!nb||(nb.shared&&!canWriteShared)) nb=tree.notebooks[0]; if(!nb){ nb={id:uid(),name:'Meu caderno',color:NB_COLORS[0],sections:[]}; tree.notebooks.push(nb); tree.openNb[nb.id]=true; }
    sec={id:uid(),name:r.data.newName,color:SEC_COLORS[nb.sections.length%SEC_COLORS.length],pages:[]}; nb.sections.push(sec); }
  else { const f=findSection(r.data.dest); if(!f){ toast('Seção de destino não encontrada.'); return } sec=f.sec; nb=f.nb; }
  const errors=[]; const created=[]; const now=Date.now();
  for(let i=0;i<jobs.length;i++){ const j=jobs[i];
    if(jobs.length>1) toast(`Importando ${i+1} de ${jobs.length}…`);
    try{ const res=j.pasted?j:await readImportFile(j.file); const box=document.createElement('div'); box.innerHTML=res.html; tidyImport(box);
      const chunks=splitImport(box,r.data.split,res.base,res.flt);
      if(!chunks.length) throw new Error('O arquivo não tem conteúdo para importar.');
      chunks.forEach(c=>{ const id=uid(); sec.pages.push({id,title:c.title,level:0,created:now,updated:now}); pageCache[id]={html:c.html||'<p><br></p>',strokes:[],paper:'plain',updatedAt:now}; created.push(id); });
    }catch(e){ errors.push(`${j.file?j.file.name:'Conteúdo colado'}: ${e&&e.message?e.message:'não foi possível ler.'}`); }
  }
  if(created.length){ commit(nb); created.forEach(id=>savePage(id)); tree.cur={...tree.cur,nb:nb.id,sec:sec.id,page:created[0],view:'page'}; tree.openNb[nb.id]=true; saveTree(); renderAll(); }
  else if(r.data.dest==='new'){ nb.sections.splice(nb.sections.indexOf(sec),1); saveTree(); }
  if(errors.length) modal({title:created.length?'Importação concluída com avisos':'Não foi possível importar',body:`${created.length?`<p>${created.length} página(s) importada(s) para “${esc(sec.name)}”.</p>`:''}<p>Estes itens não foram importados:</p><ul class="steps">${errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,actions:[{label:'Entendi',primary:true}]});
  else toast(`${created.length} página(s) importada(s) para “${sec.name}”.`);
}

function openPalette(){
  const ov=$('#overlay'); ov.innerHTML=`<div class="dialog palette" role="dialog" aria-label="Buscar"><input id="pq" placeholder="Buscar páginas, textos, #tags ou comandos…" autocomplete="off"><div class="presults" id="pr"></div></div>`;
  ov.classList.add('show'); const q=$('#pq'), pr=$('#pr'); let items=[], sel=0;
  const run=()=>{ const raw=q.value.trim(); const s=norm(raw); items=[];
    if(s.startsWith('#')){ const tq=s.slice(1); TAGS.filter(t=>norm(t.label).includes(tq)).forEach(t=>items.push({kind:'tag',t})); }
    else {
      COMMANDS.filter(c=>!s||norm(c.label).includes(s)).slice(0,s?4:3).forEach(c=>items.push({kind:'cmd',c}));
      if(s){ allPages().forEach(x=>{ const title=norm(x.page.title); const text=pageText(x.page.id); const nt=norm(text); const ti=title.indexOf(s), bi=nt.indexOf(s);
          if(ti>-1||bi>-1) items.push({kind:'page',x,score:(ti>-1?100-ti:0)+(bi>-1?10:0),snip:bi>-1?text.slice(Math.max(0,bi-40),bi+s.length+70):text.slice(0,100)}) });
        items.sort((a,b)=>(a.kind==='cmd'?-1:0)-(b.kind==='cmd'?-1:0)||(b.score||0)-(a.score||0)); }
      else tree.settings.recent.map(findPage).filter(Boolean).slice(0,6).forEach(x=>items.push({kind:'page',x,snip:pageText(x.page.id).slice(0,100)}));
    }
    items=items.slice(0,40); sel=0; draw(s); };
  const hl=(t,s)=>{ if(!s)return esc(t); const i=norm(t).indexOf(s); if(i<0)return esc(t); return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+s.length))+'</mark>'+esc(t.slice(i+s.length)) };
  const draw=s=>{ pr.innerHTML=items.map((it,i)=>it.kind==='cmd'?`<div class="pres ${i===sel?'on':''}" data-i="${i}">${icon('spark')}<div class="grow"><b>${esc(it.c.label)}</b></div><span class="where">Comando</span></div>`:
      it.kind==='tag'?`<div class="pres ${i===sel?'on':''}" data-i="${i}"><span class="tagdot" style="background:${it.t.c}">${it.t.g}</span><div class="grow"><b>${esc(it.t.label)}</b><small>Ver linhas com esta tag</small></div><span class="where">Tag</span></div>`:
      `<div class="pres ${i===sel?'on':''}" data-i="${i}"><span style="width:20px;text-align:center;flex:none">${it.x.page.icon?esc(it.x.page.icon):`<span class="secdot" style="background:${it.x.sec.color};display:inline-block"></span>`}</span><div class="grow"><b>${hl(it.x.page.title||'Sem título',s)}</b><small>${hl(it.snip.replace(/\s+/g,' '),s)}</small></div><span class="where">${esc(it.x.sec.name)}</span></div>`).join('')||`<p class="hint" style="padding:14px">Nada encontrado para “${esc(q.value)}”.</p>`;
    pr.querySelector('.on')?.scrollIntoView({block:'nearest'}); };
  const go=i=>{ const it=items[i]; if(!it)return; closeOverlay(); closeDrawers(); if(it.kind==='cmd')it.c.run(); else if(it.kind==='tag'){tagFilter=it.t.id;setView('tags')} else openPage(it.x.page.id); };
  q.addEventListener('input',run);
  q.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(items.length-1,sel+1);draw(norm(q.value.trim()))} else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);draw(norm(q.value.trim()))} else if(e.key==='Enter'){e.preventDefault();go(sel)} });
  pr.addEventListener('click',e=>{const r=e.target.closest('[data-i]');if(r)go(+r.dataset.i)});
  ov.onclick=e=>{if(e.target===ov)closeOverlay()};
  run(); setTimeout(()=>q.focus(),10);
}

let downloads=null;
function htmlToMd(root){
  const walk=(n,ctx={})=>{ if(n.nodeType===3)return n.textContent.replace(/\u00a0/g,' '); if(n.nodeType!==1)return''; const t=n.tagName; const kids=()=>[...n.childNodes].map(c=>walk(c,ctx)).join('');
    const pre=n.dataset&&n.dataset.tag&&tagById(n.dataset.tag)?`[${tagById(n.dataset.tag).label}] `:''; const post=n.dataset&&n.dataset.due?` (⏰ ${dueLabel(+n.dataset.due)})`:'';
    if(n.classList&&n.classList.contains('sync')){ const r=syncContent(n.dataset.syncPage,n.dataset.syncBlock); return r&&r.el?walk(r.el,ctx):''; }
    if(n.classList&&n.classList.contains('audio'))return'\n[Gravação de áudio · '+fmtDur(+n.dataset.dur)+']\n'+(n.dataset.transcript?'> '+n.dataset.transcript+'\n':'')+'\n';
    switch(t){ case'H1':return'\n# '+pre+kids()+post+'\n\n'; case'H2':return'\n## '+pre+kids()+post+'\n\n'; case'H3':return'\n### '+pre+kids()+post+'\n\n';
      case'P':case'DIV':return pre+kids()+post+'\n\n'; case'BR':return'\n'; case'B':case'STRONG':return'**'+kids()+'**'; case'I':case'EM':return'*'+kids()+'*'; case'S':case'STRIKE':return'~~'+kids()+'~~';
      case'CODE':return'`'+kids()+'`'; case'PRE':return'\n```\n'+n.textContent+'\n```\n\n'; case'BLOCKQUOTE':return (pre+kids()+post).trim().split('\n').map(l=>'> '+l).join('\n')+'\n\n'; case'HR':return'\n---\n\n';
      case'A':return n.classList.contains('plink')?kids():'['+kids()+']('+n.getAttribute('href')+')'; case'IMG':return'![imagem]('+(n.src.length>200?'imagem-incorporada':n.src)+')';
      case'UL':case'OL':{const d=(ctx.d||0); return [...n.children].map((li,i)=>{const p2='  '.repeat(d)+(n.classList.contains('checklist')?(li.dataset.checked==='true'?'- [x] ':'- [ ] '):(t==='OL'?(i+1)+'. ':'- ')); const tg=li.dataset.tag&&tagById(li.dataset.tag)?`[${tagById(li.dataset.tag).label}] `:''; const du=li.dataset.due?` (⏰ ${dueLabel(+li.dataset.due)})`:''; return p2+tg+[...li.childNodes].map(c=>walk(c,{d:d+1})).join('').trim()+du}).join('\n')+'\n'+(d?'':'\n')}
      case'TABLE':{const rows=[...n.querySelectorAll('tr')].map(r=>'| '+[...r.children].map(c=>c.textContent.trim().replace(/\|/g,'\\|')).join(' | ')+' |'); if(rows.length){const cols=n.querySelector('tr').children.length; rows.splice(1,0,'|'+' --- |'.repeat(cols))} return rows.join('\n')+'\n\n'}
      default:return kids(); } };
  return walk(root).replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

async function runAI(kind,question,extra){

  const asks={tsum:`Esta é a transcrição automática de uma gravação de áudio (pode ter erros de reconhecimento). Faça um resumo em tópicos, depois uma seção "Tarefas" com as ações mencionadas no formato - [ ].\n\nTranscrição:\n"""\n${String(extra||'').slice(0,12000)}\n"""`,

    tasks:'Liste as ações e tarefas implícitas ou explícitas nesta página. Responda APENAS com um array JSON de strings, cada uma uma tarefa curta começando com verbo.',

    continue:'Continue escrevendo a partir de onde a página termina, no mesmo estilo, com um ou dois parágrafos. Responda apenas com a continuação.',
    simple:'Explique o conteúdo desta página de forma simples, como para alguém que está começando no assunto.',
    quiz:'Crie 5 perguntas de estudo com respostas curtas baseadas nesta página, para revisão.'};

  }catch(e){ aiOut.classList.remove('thinking'); const c=e&&e.code;

  const lines=md.replace(/\r/g,'').split('\n'); let h='', list=null;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/`(.+?)`/g,'<code>$1</code>');
  const close=()=>{if(list){h+=`</${list==='ol'?'ol':'ul'}>`;list=null}};
  lines.forEach(l=>{ let m;
    if((m=l.match(/^\s*[-*] \[( |x|X)\] (.*)/))){ if(list!=='check'){close();h+='<ul class="checklist">';list='check'} h+=`<li data-checked="${m[1].trim()?'true':'false'}">${inline(m[2])}</li>`; }
    else if((m=l.match(/^\s*[-*] (.*)/))){ if(list!=='ul'){close();h+='<ul>';list='ul'} h+=`<li>${inline(m[1])}</li>`; }
    else if((m=l.match(/^\s*\d+[.)] (.*)/))){ if(list!=='ol'){close();h+='<ol>';list='ol'} h+=`<li>${inline(m[1])}</li>`; }
    else { close(); if((m=l.match(/^(#{1,3}) (.*)/))) h+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; else if(l.trim()) h+=`<p>${inline(l)}</p>`; }
  }); close(); return h;
}
$('#aiInsert').addEventListener('click',()=>{ if(!editor||!aiResult)return; editor.focus(); caretAt(editor,false); document.execCommand('insertHTML',false,mdToHtml(aiResult)+'<p><br></p>'); onEdit(); toast('Inserido no fim da página.'); });
$('#aiReplace').addEventListener('click',()=>{ if(!editor||!aiResult||!lastRange)return; restoreRange(); editor.focus(); document.execCommand('insertText',false,aiResult.trim()); onEdit(); });
$('#aiCopy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(aiResult);toast('Copiado.')}catch(_){toast('Não foi possível copiar.')}});

/* ================= Overlays ================= */
let modalResolve=null;
function modal({title,body,actions,focus,collect,pick,onOpen}){
  return new Promise(res=>{
    const ov=$('#overlay'); modalResolve=res;
    ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header>${esc(title)}</header><div class="body">${body||''}</div><footer>${actions.map((a,i)=>`<button class="btn ${a.primary?'primary':''} ${a.danger?'danger':''}" data-a="${i}">${esc(a.label)}</button>`).join('')}</footer></div>`;
    ov.classList.add('show');
    const done=v=>{ov.classList.remove('show');ov.innerHTML='';modalResolve=null;res(v)};
    ov.onclick=e=>{ if(e.target===ov)return done(null);
      const pb=e.target.closest('.pickrow[data-v]'); if(pb&&pick&&!pb.disabled)return done({value:pb.dataset.v});
      const b=e.target.closest('[data-a]'); if(b){const a=actions[+b.dataset.a];done({value:a.value||'cancel',data:collect?collect():null})} };
    ov.onkeydown=e=>{ if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!pick){const i=actions.findIndex(a=>a.primary);if(i>-1){e.preventDefault();done({value:actions[i].value,data:collect?collect():null})}} };
    if(onOpen)onOpen();
    setTimeout(()=>{const f=focus?$(focus):ov.querySelector('.btn.primary')||ov.querySelector('.btn');if(f){f.focus();if(f.select&&f.type==='text')f.select()}},20);
  });
}
function closeOverlay(){ const ov=$('#overlay'); if(!ov.classList.contains('show'))return; ov.classList.remove('show'); ov.innerHTML=''; if(modalResolve){const r=modalResolve;modalResolve=null;r(null)} }
async function askText(title,value,ph){ const r=await modal({title,body:`<input class="field" type="text" id="askF" value="${esc(value||'')}" placeholder="${esc(ph||'')}">`,actions:[{label:'Cancelar'},{label:'Salvar',primary:true,value:'ok'}],focus:'#askF',collect:()=>$('#askF').value.trim()}); return r&&r.value==='ok'?r.data:null; }
async function confirmBox(title,msg,ok,danger){ const r=await modal({title,body:`<p>${esc(msg)}</p>`,actions:[{label:'Cancelar'},{label:ok,primary:true,danger,value:'ok'}]}); return !!(r&&r.value==='ok'); }
const menuEl=$('#menu');
function showMenu(anchor,items,x,y){
  menuEl.innerHTML=items.map((it,i)=>it.sep?'<hr>':it.type==='label'?`<div class="mlabel">${esc(it.label)}</div>`:
    it.type==='swatches'?`<div class="swrow">${it.colors.map(c=>`<button data-i="${i}" data-c="${c}" title="${c}" style="background:${c==='inherit'?'var(--ink)':c==='transparent'?'repeating-linear-gradient(45deg,var(--line) 0 3px,var(--surface) 3px 6px)':c}"></button>`).join('')}</div>`:
    it.type==='grid'?`<div class="grid" style="grid-template-columns:repeat(${it.cols},${it.size?it.size+'px':'auto'})">${it.cells.map(c=>`<button data-i="${i}" data-c="${esc(c.value)}" ${it.size?`style="width:${it.size}px;height:${it.size}px"`:'style="padding:3px"'}>${c.html}</button>`).join('')}</div>`:
    `<button class="mi ${it.danger?'danger':''}" data-i="${i}" ${it.disabled?'disabled':''}>${it.pre||(it.icon?icon(it.icon):'')}<span>${esc(it.label)}</span>${it.checked?'<span class="k" style="color:var(--accent)">✓</span>':it.k?`<span class="k">${esc(it.k)}</span>`:''}</button>`).join('');
  menuEl.classList.add('show');
  let px=x,py=y; if(anchor){const r=anchor.getBoundingClientRect();px=r.left;py=r.bottom+4}
  const mw=menuEl.offsetWidth, mh=menuEl.offsetHeight; px=Math.min(px,innerWidth-mw-8); if(py+mh>innerHeight-8)py=Math.max(8,(anchor?anchor.getBoundingClientRect().top:py)-mh-4);
  menuEl.style.left=Math.max(8,px)+'px'; menuEl.style.top=py+'px';
  menuEl.onmousedown=e=>e.preventDefault();
  menuEl.onclick=e=>{const b=e.target.closest('[data-i]');if(!b||b.disabled)return;const it=items[+b.dataset.i];hideMenu();if(it.type==='swatches'||it.type==='grid')it.action(b.dataset.c);else it.action&&it.action()};
  if(!anchor) menuEl.querySelector('button:not([disabled])')?.focus();
}
function hideMenu(){menuEl.classList.remove('show')}
document.addEventListener('mousedown',e=>{if(!menuEl.contains(e.target))hideMenu(); if(!bubble.contains(e.target)&&!(editor&&editor.contains(e.target)))hideBubble()});
let toastT;
function toast(msg,action){ const t=$('#toast'); t.innerHTML=`<span>${esc(msg)}</span>`+(action?`<button>${esc(action.label)}</button>`:''); t.classList.add('show'); if(action)t.querySelector('button').onclick=()=>{t.classList.remove('show');action.fn()}; clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),action?6500:3200); }

/* ================= Theme, focus, drawers ================= */
function applyTheme(){ const t=tree.settings.theme; const root=document.documentElement; if(t==='auto'||!t)root.removeAttribute('data-theme');else root.setAttribute('data-theme',t); const dark=t==='dark'||((t==='auto'||!t)&&matchMedia('(prefers-color-scheme: dark)').matches); $('#themeBtn').innerHTML=icon(dark?'sun':'moon');
  const a=ACCENTS[tree.settings.accent]; if(a&&tree.settings.accent>0){ const c=dark?a[1]:a[0]; root.style.setProperty('--accent',c); root.style.setProperty('--accent-soft',`color-mix(in srgb,${c} ${dark?14:10}%,transparent)`); root.style.setProperty('--sel',`color-mix(in srgb,${c} ${dark?16:10}%,transparent)`); } else ['--accent','--accent-soft','--sel'].forEach(k=>root.style.removeProperty(k)); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme()); }catch(_){}
function toggleTheme(){ const a=document.documentElement.getAttribute('data-theme'); const dark=a==='dark'||(!a&&matchMedia('(prefers-color-scheme: dark)').matches); tree.settings.theme=dark?'light':'dark'; applyTheme(); saveTree(); }
$('#themeBtn').addEventListener('click',toggleTheme);
function toggleFocus(){ app.classList.toggle('focus'); $('#focusBtn').classList.toggle('on',app.classList.contains('focus')); }
$('#focusBtn').addEventListener('click',toggleFocus);
$('#goTrash').addEventListener('click',()=>{setView('trash');closeDrawers()});
function closeDrawers(){ app.classList.remove('railopen','pagesopen'); $('#scrim').classList.remove('show'); }
$('#railToggle').addEventListener('click',()=>{app.classList.remove('pagesopen');app.classList.toggle('railopen');$('#scrim').classList.toggle('show',app.classList.contains('railopen'))});
$('#pagesToggle').addEventListener('click',()=>{app.classList.remove('railopen');app.classList.toggle('pagesopen');$('#scrim').classList.toggle('show',app.classList.contains('pagesopen'))});
$('#scrim').addEventListener('click',closeDrawers);
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&(e.key==='k'||e.key==='K')){e.preventDefault();openPalette();return}
  if(mod&&e.key==='.'){e.preventDefault();toggleFocus();return}
  if(e.altKey&&!mod&&e.code==='KeyN'){e.preventDefault();tree.cur.view='page';newPage();return}
  if(e.key==='Escape'){ if(slash)closeSlash(); else if(menuEl.classList.contains('show'))hideMenu(); else if($('#overlay').classList.contains('show'))closeOverlay(); else if(bubble.classList.contains('show'))hideBubble(); else if(drawMode)toggleDraw(); else if($('#ai').classList.contains('show'))$('#ai').classList.remove('show'); else closeDrawers(); }
});
